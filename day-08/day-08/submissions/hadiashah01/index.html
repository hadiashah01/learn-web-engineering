<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Build a Flexbox Layout</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="border flex--column">
      <div class="header__items border--red"></div>
      <div class="header__items border--red"></div>
    </header>
    <div class="content flex--row">
      <nav class="border flex--column">
        <div class="nav__items first__nav__item border--red"></div>
        <div class="nav__items border--red"></div>
        <div class="nav__items border--red"></div>
        <div class="nav__items border--red"></div>
        <div class="nav__items border--red"></div>
      </nav>
      <main class="border flex--column">

        <div class="cards flex--row border--red">
          <div class="card__item first__card__item border--blue"></div>
          <div class="card__item border--blue"></div>
          <div class="card__item border--blue"></div>
          <div class="card__item border--blue"></div>
        </div>
        <div class="cards flex--row border--red">
          <div class="card__item card__item--primary  border--blue flex--column">
            <div class="child border--green"></div>
            <div class="child border--green"></div>
            <div class="child border--green"></div>
          </div>
          <div class="card__item border--blue last__card__item flex--column">
            <div class="child border--green"></div>
            <div class="child border--green"></div>
          </div>
        </div>
        <div class="cards flex--row border--red">
          <div class="card__item card__item--primary  border--blue flex--column">
            <div class="child border--green"></div>
            <div class="child border--green"></div>
            <div class="child border--green"></div>
          </div>
          <div class="card__item last__card__item border--blue flex--column">
            <div class="child border--green"></div>
            <div class="child border--green"></div>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
